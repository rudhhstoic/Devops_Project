name: CI - AI Stock Advisor

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Check syntax (lint)
      run: |
        python -m py_compile app.py
        python -m py_compile services/stock_service.py
        python -m py_compile services/news_service.py
        python -m py_compile services/ai_service.py
        python -m py_compile services/email_service.py
        echo "✅ All files passed syntax check"

    - name: Build Docker image
      run: docker build -t ai-stock-advisor .
